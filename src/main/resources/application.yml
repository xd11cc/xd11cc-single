server:
  port: 10001
  shutdown: graceful
  servlet:
    context-path: /xd11cc

spring:
  application:
    name: xd11cc-single
  profiles:
#    active: @profileActive@
    active: dev
  autoconfigure:
    exclude:
      # 排除 Flowable starter 里用不到的引擎自动配置，保留 ProcessEngineAutoConfiguration
      - org.flowable.spring.boot.app.AppEngineAutoConfiguration
      - org.flowable.spring.boot.app.AppEngineServicesAutoConfiguration
      - org.flowable.spring.boot.idm.IdmEngineAutoConfiguration
      - org.flowable.spring.boot.idm.IdmEngineServicesAutoConfiguration
      - org.flowable.spring.boot.cmmn.CmmnEngineAutoConfiguration
      - org.flowable.spring.boot.cmmn.CmmnEngineServicesAutoConfiguration
      - org.flowable.spring.boot.dmn.DmnEngineAutoConfiguration
      - org.flowable.spring.boot.dmn.DmnEngineServicesAutoConfiguration
      - org.flowable.spring.boot.form.FormEngineAutoConfiguration
      - org.flowable.spring.boot.form.FormEngineServicesAutoConfiguration
      - org.flowable.spring.boot.content.ContentEngineAutoConfiguration
      - org.flowable.spring.boot.content.ContentEngineServicesAutoConfiguration
      - org.flowable.spring.boot.eventregistry.EventRegistryAutoConfiguration
      - org.flowable.spring.boot.eventregistry.EventRegistryServicesAutoConfiguration
      - org.flowable.spring.boot.actuate.info.FlowableInfoAutoConfiguration
      - org.flowable.spring.boot.EndpointAutoConfiguration
      - org.flowable.spring.boot.RestApiAutoConfiguration
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  mvc:
    path match:
      # 由于spring默认的url匹配策略是PATH_PATTERN_PARSER，与security匹配规则不一致可能会导致安全策略失效
      matching-strategy: ant_path_matcher
  main:
    allow-circular-references: true # 开启循环依赖支持
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# 日志级别
logging:
  level:
    com.xd11cc.*: debug

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: del_flag # 全局逻辑删除字段名
      id-type: auto
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 分页插件
pagehelper:
  helper-dialect: mysql
  reasonable: true

# netty配置
netty:
  websocket:
    port: 12001
    reader-idle-time: 30
    writer-idle-time: 60
    web-socket-path: /ws
    max-frame-length: 65536

# swagger配置
swagger:
  title: 后端API
  description: xd11cc单体架构后端API
  version: v1.0.0

# security白名单配置
security:
  permit-all-urls:
    # 静态资源
    - /**/**.html
    - /**/**.css
    - /**/**.js
    # swagger白名单配置
    - /doc.html
    - /swagger-ui.html
    - /webjars/**
    - /swagger-resources/**
    - /v2/api-docs/**
    - /favicon.ico
    - /csrf
    - /
    # druid监控地址
    - /druid/**
    - /druid-flowable/**
    # 登录相关白名单
    - /login/loginByPassword
    - /login/getCaptcha
    - /login/authorize/**
    - /login/callback/**
    - /login/social-user/bind
    - /auth/client/config/list
    # 匿名上传文件
    - /file/upload/anonymous
    # minio域名白名单
    - /system/config/getConfig/minio-domain

# CORS跨域配置
cors:
  allowed-origins:
    - "*"

# 需要忽略租户的表
tenant:
  ignoreTables:
    - system_menu
    - system_dict_type
  ignoreUrls:

# Flowable 流程引擎配置
# 多余引擎通过 spring.autoconfigure.exclude 排除（见上方 spring 段），此处只需保留引擎本体配置
flowable:
  database-schema-update: false            # 首次启动自动建/升级 ACT_* 表；建完后请手动改为 false
  history-level: audit                    # 保留完整历史（变量、任务详情等）
  async-executor-activate: false          # 关闭异步执行器；开启后需手动传递 TransmittableThreadLocal