# druid数据源配置
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      master:
        url: jdbc:mysql://127.0.0.1:3306/xd11cc_single?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
        username: root
        password: xd11cc@1216
#        password: root
      slave:
        enable: false
        url:
        username:
        password:

      # Flowable 流程引擎专用数据源（指向 xd11cc_flowable schema）
      flowable:
        url: jdbc:mysql://127.0.0.1:3306/xd11cc_flowable?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
        username: root
        password: xd11cc@1216
        initial-size: 2
        min-idle: 2
        max-active: 10
        max-wait: 60000
        connect-timeout: 30000
        socket-timeout: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        max-evictable-idle-time-millis: 900000
        validation-query: SELECT 1 FROM DUAL
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
      # 初始连接数
      initial-size: 5
      # 最小连接池数量
      min-idle: 10
      # 最大连接池数量
      max-active: 20
      # 配置获取连接等待超时的时间
      max-wait: 60000
      # 配置连接超时时间
      connect-timeout: 30000
      # 配置网络超时时间
      socket-timeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      time-between-eviction-runs-millis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      min-evictable-idle-time-millis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      max-evictable-idle-time-millis: 900000
      # 配置检测连接是否有效
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        # 设置白名单，不填则允许所有访问
        allow:
        url-pattern: /druid/*
        # 控制台管理用户名和密码
        login-username: admin
        login-password: xd11cc@1216
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 2000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: false

  # redis配置
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
#    password:
    password: xd11cc@1216
    # 连接超时时间
    connect-timeout: 10s
    lettuce:
      pool:
        # 连接池中最小空闲连接
        min-idle: 4
        # 连接池中最大空闲连接
        max-idle: 16
        # 连接池的最大数据库连接
        max-active: 32
        # 连接池的最大阻塞等待时间（负值代表没有限制）
        max-wait: 2000ms
  # rabbitmq配置
  rabbitmq:
    # 使用 127.0.0.1 而非 localhost：Docker 端口映射在 IPv6 回环(::1)上连接不稳定，
    # 会导致消费者反复重连（Socket closed）
    host: 127.0.0.1
    port: 5672
    username: admin
    password: xd11cc@1216
    virtual-host: / # 默认虚拟主机
    publisher-confirm-type: correlated # 生产者确认配置（确保消息发送到交换机）
    publisher-returns: true # 生产者回调配置（确保消息路由到队列）
    # 消费者配置（手动确认消息，避免消息丢失）
    listener:
      simple:
        acknowledge-mode: manual # 手动ACK，由 MqConsumeTemplate 控制 basicAck / basicNack
        # 初始消费者线程数。不要设为 1：MqConsumeTemplate 重试会阻塞线程
        # （1s+5s+15s 约 21 秒），单线程时整条队列会在此期间停摆
        concurrency: 3
        # 积压时自动扩容的上限。受业务库连接池约束（max-active=20），取一半
        max-concurrency: 10
        # 每个消费者最多预取多少条未确认消息。默认 250 在手写 ACK 场景下会让
        # 单个消费者独占大量消息，导致其他消费者空转、该消费者崩溃时大量重投
        prefetch: 1
        # 设为 false 表示「处理失败的默认丢弃、不重新入队」，失败消息走 DLX 进死信队列。
        # 框架默认是 true，会让未捕获的异常触发无限重新入队（毒消息循环）
        default-requeue-rejected: false
        # 注意：不要开启 retry.enabled。重试已由 MqConsumeTemplate 统一负责，
        # 两者叠加会形成「外层 Spring Retry × 内层模板重试」的乘数效应
# xxl-job配置
xxl:
  job:
    executor:
      app-name: ${spring.application.name}
      log-path: ${XXL_JOB_LOG_PATH:./logs/xxl-job}
      log-retention-days: 30
    admin:
      addresses: https://xd11cc.xyz/xxl-job-admin
    access-token: default_token

# minio配置
